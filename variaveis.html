<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dead Cells 2</title>

  <link rel="stylesheet" href="variaveis.css">
</head>

<body>

  <div class="card">

    <div class="imagem">
      <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/588650/header.jpg" alt="Dead Cells">
    </div>

    <div class="conteudo">

      <h1 class="titulo">Dead Cells 2</h1>

      <p class="descricao">
        Entre em um mundo sombrio cheio de ação, inimigos perigosos
        e batalhas intensas. Explore mapas secretos, desbloqueie armas
        lendárias e sobreviva aos desafios do universo de Dead Cells.
      </p>

      <div class="botoes">
        <button class="botao">Jogar Agora</button>
        <button class="botao">Ver Trailer</button>
      </div>

    </div>

  </div>

</body>
</html>
